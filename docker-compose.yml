# ============================================================================
# ReliefChain - local database stack
# Owner: Member 1 (Database Architect & Core Backend)
#
#   docker compose up -d     start PostgreSQL 16 + pgvector and MongoDB 7
#   docker compose down -v   stop and wipe both databases
#
# On first start (empty volume) Postgres runs every top-level sql/*.sql file
# in alphabetical order (01 -> 05). Files in sql/queries/ are NOT run.
# ============================================================================
name: reliefchain

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reliefchain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reliefchain_db
      POSTGRES_USER: relief_admin
      POSTGRES_PASSWORD: relief_secret_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # override if 5432 is taken: POSTGRES_PORT=5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relief_admin -d reliefchain_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: reliefchain_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: reliefchain_logs
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
